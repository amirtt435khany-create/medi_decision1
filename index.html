easy:[{q:"بعد از عمل، سوختگی درجه ۲ زیر پلیت بیمار دیده شد. محتمل‌ترین علت؟",d:"مدار برگشتی.",opts:[{t:"تماس ناقص پلیت، محل نصب پرمو/استخوانی، پلیت خشک یا مصرف مجدد",s:20,safe:20,f:"کلاسیک‌ترین علت سوختگی ESU همین است.",c:"مسیر به پروتکل پلیت می‌رود."},{t:"قدرت بالای ژنراتور توسط جراح",s:8,safe:5,f:"ممکن است ولی دومین علت است؛ اول مدار برگشت.",c:"ترتیب عیب‌یابی مهم است."},{t:"حساسیت پوستی بیمار",s:0,safe:0,f:"سوختگی ESU حرارتی است نه آلرژیک.",c:"مکانیسم را اشتباه گرفتی."}]},
{q:"پلیت استاندارد کجاست؟",d:"placement.",opts:[{t:"عضله‌ی بزرگ، تمیز، خشک، بدون مو، نزدیک محل جراحی، تمام سطح چسبیده",s:20,safe:20,f:"پروتکل طلایی REM/CQM.",c:"امپدانس تماسی پایین آمد."},{t:"روی زخم، خالکوبی یا پروتز فلزی",s:0,safe:-20,f:"خطای بحرانی: تمرکز جریان = سوختگی شدید.",c:"این نواحی ممنوع مطلق‌اند."}]},
{q:"حین Cut دود زیاد و برش کند است. بررسی؟",d:"الکترود فعال.",opts:[{t:"تمیزکردن eschar از نوک الکترود، چک اتصال هندپیس، تنظیم توان طبق توصیه‌ی سازنده",s:20,safe:10,f:"eschar امپدانس را بالا و برش را خراب می‌کند.",c:"بدون افزایش کور توان حل شد."},{t:"توان را تا آخر زیاد کن",s:0,safe:-15,f:"خطر نکروز عمقی و آتش‌سوزی.",c:"توان آخرین راه است."}]},
{q:"بیمار پیس‌میکر دارد و ESU لازم است. اقدام ایمن؟",d:"تداخل با ایمپلنت.",opts:[{t:"هماهنگی با متخصص قلب/بیهوشی، حالت Bipolar، حداقل توان، پلیت دور از پیس‌میکر، مانیتورینگ مداوم",s:20,safe:20,f:"پروتکل بیمار پرخطر کامل.",c:"ریسک مهار پیس‌میکر مدیریت شد."},{t:"مثل معمول ادامه بده",s:0,safe:-20,f:"بحرانی: امکان مهار یا آسیب پیس‌میکر.",c:"بیمار پرخطر پروتکل جدا دارد."}]},
{q:"اقدام پایانی مهندسی؟",d:"PM.",opts:[{t:"تست توان خروجی با آنالایزر ESU، تست REM، ثبت و آموزش تیم اتاق عمل",s:20,safe:15,f:"چرخه‌ی کامل مدیریت ریسک.",c:"دستگاه با برچسب سلامت برگشت."},{t:"فقط تمیزکردن دستگاه",s:3,safe:0,f:"کافی نیست.",c:"تست عملکردی لازم است."}]}],
medium:[{q:"بیمار دچار تحریک عضلانی حین Coag شد. علت مهندسی؟",d:"فرکانس و اتصال.",opts:[{t:"نشتی فرکانس پایین، اتصال زمین نامناسب، خرابی ایزولاسیون هندپیس",s:20,safe:15,f:"تحلیل دقیق.",c:"ایزولاسیون با تستر چک شد."},{t:"طبیعی است",s:0,safe:-10,f:"ESU استاندارد تحریک فارادیک نمی‌دهد.",c:"غیرطبیعی را عادی نگیر."}]}],
advanced:[{q:"آتش‌سوزی کوچک به‌علت الکل ضدعفونی + ESU. اقدام سیستمی؟",d:"مثلث آتش.",opts:[{t:"پروتکل ضد حریق: خشک‌شدن کامل الکل، اکسیژن کنترل‌شده، دراپ‌بندی، آموزش و چک‌لیست",s:20,safe:20,f:"مدیریت سیستمی ایمنی.",c:"ریسک سیستمیک بسته شد."},{t:"مقصر پرستار است",s:0,safe:-10,f:"نگاه سرزنش فردی ضد ایمنی بیمار است.",c:"سیستم را اصلاح کن نه فرد را."}]}]
}}
};
let state={screen:"home",device:null,level:"easy",step:0,path:[],score:0,safety:0,done:{}};
function load(){try{const d=JSON.parse(localStorage.getItem("medi_adv")||"{}");if(d.done)state.done=d.done;}catch(e){}}
function save(){localStorage.setItem("medi_adv",JSON.stringify({done:state.done}))}
load();
function qs(dev,lv){const s=SCENARIOS[dev];if(lv==="easy")return s.levels.easy;if(lv==="medium")return s.levels.easy.concat(s.levels.medium);return s.levels.easy.concat(s.levels.medium, s.levels.advanced);}
function render(){
const app=document.getElementById("app");
if(state.screen==="home"){
app.innerHTML=`<div class="card"><h2>انتخاب مأموریت آموزشی</h2><p style="opacity:.75;line-height:2;margin:8px 0">سطح را انتخاب کن، دستگاه را بزن و پرونده را مرحله‌به‌مرحله حل کن. پیشرفتت ذخیره می‌شود.</p>
<div class="level-row no-print"><label>سطح دشواری:</label><select id="lv" onchange="setLevel(this.value)"><option value="easy">🟢 آسان (۵ مرحله)</option><option value="medium">🟡 متوسط (۶ مرحله)</option><option value="advanced">🔴 پیشرفته (۷ مرحله)</option></select></div>
<div class="grid">${Object.keys(SCENARIOS).map(k=>`<div class="device" onclick="startCase('${k}')"><h3>${SCENARIOS[k].icon} ${SCENARIOS[k].title}</h3><small>${SCENARIOS[k].desc}</small><br><span class="badge">${state.done[k]?"✅ تکمیل‌شده":"⬜ انجام‌نشده"}</span><span class="badge warn">${SCENARIOS[k].levels.easy.length} تا ۷ مرحله</span></div>`).join("")}</div>
<div class="stats"><div class="stat"><b>${Object.keys(state.done).length} / 4</b>مأموریت تکمیل‌شده</div><div class="stat"><b>${state.score}</b>مجموع امتیاز آموزشی</div><div class="stat"><b>${state.safety}</b>امتیاز ایمنی</div></div>
<button class="btn ghost" onclick="resetAll()">↺ شروع دوباره‌ی همه</button></div>`;
document.getElementById("lv").value=state.level;
}
else if(state.screen==="case"){
const steps=qs(state.device,state.level);const st=steps[state.step];const pct=Math.round(state.step/steps.length*100);
app.innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px"><span class="badge">CASE / ${SCENARIOS[state.device].title}</span><span class="badge">مرحله ${state.step+1} از ${steps.length}</span><span class="badge ${state.safety<0?"warn":""}">ایمنی: ${state.safety}</span><span class="badge">امتیاز: ${state.score}</span></div>
<div class="progress"><div style="width:${pct}%"></div></div>
<h2 style="margin:10px 0">${st.q}</h2><p style="opacity:.7;line-height:2">💡 راهنما: ${st.d}</p>
${st.opts.map((o,i)=>`<button class="option" onclick="answer(${i})">${["الف","ب","ج"][i]||(i+1)} — ${o.t}</button>`).join("")}
<button class="btn danger" onclick="goHome()">انصراف</button></div>`;
}
else if(state.screen==="feedback"){
const last=state.path[state.path.length-1];
const cls=last.gain>=20?"good":(last.gain<=2?"bad":"mid");
app.innerHTML=`<div class="card"><h2>${last.gain>=20?"✅ تصمیم درست":"⚠️ نیاز به بازبینی"}</h2>
<div class="feedback ${cls}"><b>بازخورد آموزشی:</b> ${last.feedback}<br><b>تحلیل مسیر:</b> ${last.cause}<br><b>امتیاز:</b> +${last.gain} | <b>ایمنی:</b> ${last.safe>=0?"+":""}${last.safe}</div>
<button class="btn" onclick="nextStep()">مرحله‌ی بعد ←</button></div>`;
}
else if(state.screen==="report"){
const pct=Math.round(state.score/(state.path.length*20)*100);
let grade=pct>=85?"ارزیابی: عملکرد حرفه‌ای ⭐":pct>=60?"ارزیابی: قابل قبول با نیاز به مرور":"ارزیابی: نیاز به آموزش مجدد";
let rows=state.path.map((p,i)=>`<tr><td>${i+1}</td><td>${p.q}</td><td>${p.choice}</td><td>${p.gain} / ایمنی ${p.safe}</td><td>${p.feedback} ${p.cause}</td></tr>`).join("");
let errors=state.path.filter(p=>p.gain<15);
let errTxt=errors.length?errors.map(e=>"• "+e.feedback).join("<br>"):"خطای مهمی ثبت نشد. آفرین!";
app.innerHTML=`<div class="card" id="reportCard"><h2>📋 گزارش اختصاصی عملکرد — ${SCENARIOS[state.device].title}</h2>
<p style="opacity:.7">سطح: ${state.level==="easy"?"آسان":state.level==="medium"?"متوسط":"پیشرفته"} | تاریخ: ${new Date().toLocaleDateString("fa-IR")}</p>
<div class="stats"><div class="stat"><b>${state.score}</b>امتیاز فنی</div><div class="stat"><b>${state.safety}</b>امتیاز ایمنی</div><div class="stat"><b>٪${pct}</b>${grade}</div></div>
<h3>۱) مسیر تصمیم‌گیری</h3><table><tr><th>مرحله</th><th>سؤال</th><th>انتخاب شما</th><th>نمره</th><th>تحلیل</th></tr>${rows}</table>
<h3 style="margin-top:14px">۲) تحلیل خطاها</h3><p style="line-height:2.2">${errTxt}</p>
<h3>۳) نکته‌ی فنی و ایمنی</h3><p style="line-height:2.2">${techNote(state.device)}</p>
<h3>۴) پیشنهاد بررسی بعدی</h3><p style="line-height:2.2">${nextStepTxt(state.device)}</p>
<div class="no-print" style="margin-top:14px"><button class="btn" onclick="window.print()">🖨️ چاپ / PDF</button><button class="btn ghost" onclick="downloadReport()">⬇️ دانلود گزارش</button><button class="btn ghost" onclick="goHome()">🏠 مأموریت بعدی</button><button class="btn danger" onclick="retry()">↺ شروع دوباره</button></div></div>`;
}
}
function techNote(d){return{ecg:"نکته‌ی فنی ECG: امپدانس پوست باید زیر 5kΩ باشد؛ کابل‌ها را دور از کابل برق رد کن؛ تست نشتی الکتریکی سالانه (＜100µA). نکته‌ی ایمنی: هرگز گین و فیلتر را برای پنهان‌کردن نویز تغییر نده.",spo2:"نکته‌ی فنی SpO2: دو طول‌موج 660/940nm؛ حرکت، نور محیط و رنگ مانع دقت است. نکته‌ی ایمنی: عدد مشکوک هرگز مبنای تغییر اکسیژن‌درمانی نیست؛ با SQI و معاینه تطبیق بده.",pump:"نکته‌ی فنی پمپ: دقت معمول ±5٪؛ سنسور Air و Occlusion اینترلاک ایمنی‌اند و bypass ممنوع. نکته‌ی ایمنی: هواگیری کامل، تطبیق ml/h با دستور کتبی و Drug Library الزامی است.",esu:"نکته‌ی فنی ESU: فرکانس 300kHz-3MHz؛ پلیت (REM) مدار برگشت است و سوختگی از تماس ناقص می‌آید. نکته‌ی ایمنی: پلیت روی عضله‌ی تمیز، دور از ایمپلنت؛ الکل باید کامل خشک شود (مثلث آتش)."}[d];}
function nextStepTxt(d){return{ecg:"تست کابل با مولتی‌متر، تست نشتی الکتریکی، بازبینی PM سه‌ماهه و آموزش آماده‌سازی پوست به پرستاران.",spo2:"تست با شبیه‌ساز SpO2، موجودی پروب در سایزهای مختلف، آموزش تطبیق پروب و SQI.",pump:"کالیبراسیون دبی با آنالایزر تزریق، تست باتری، بازبینی Drug Library.",esu:"تست توان با آنالایزر ESU، تست REM، چک‌لیست اتاق عمل و آموزش تیم جراحی."}[d];}
function setLevel(v){state.level=v;render();}
function startCase(d){state.device=d;state.step=0;state.path=[];state.score=0;state.safety=0;state.screen="case";render();window.scrollTo(0,0);}
function answer(i){const steps=qs(state.device,state.level);const st=steps[state.step];const o=st.opts[i];state.score+=o.s;state.safety+=o.safe;state.path.push({q:st.q,choice:o.t,gain:o.s,safe:o.safe,feedback:o.f,cause:o.c});state.screen="feedback";render();window.scrollTo(0,0);}
function nextStep(){const steps=qs(state.device,state.level);state.step++;if(state.step>=steps.length){state.screen="report";state.done[state.device]=true;save();}else state.screen="case";render();window.scrollTo(0,0);}
function goHome(){state.screen="home";render();}
function retry(){startCase(state.device);}
function resetAll(){localStorage.removeItem("medi_adv");state.done={};state.score=0;state.safety=0;goHome();}
function downloadReport(){let txt=`MEDI-DECISION REPORT - ${SCENARIOS[state.device].title}\nLevel: ${state.level}\nScore: ${state.score} | Safety: ${state.safety}\n\n`;state.path.forEach((p,i)=>{txt+=`${i+1}. ${p.q}\nChoice: ${p.choice}\nScore: ${p.gain} Safety:${p.safe}\n${p.feedback} ${p.cause}\n\n`;});txt+=techNote(state.device)+"\n"+nextStepTxt(state.device);const b=new Blob([txt],{type:"text/plain;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="medi-report.txt";a.click();}
render();
</script>
</body>
</html>
