const TRICK={ecg:"ترفند ECG: قبل از هر کاری به چشم بیمار نگاه کن و نبض بگیر؛ ۱۰ ثانیه‌ات از ۱۰ دقیقه تعمیر باارزش‌تر است.",spo2:"ترفند SpO2: به عدد اعتماد نکن، به موج اعتماد کن؛ موج Pleth خوب = عدد خوب.",pump:"ترفند پمپ: هر آلارم = اول کلمپ را ببند بعد فکر کن؛ بولوس ناخواسته برنمی‌گردد.",esu:"ترفند ESU: پلیت را مثل بخیه جدی بگیر؛ ۸۰٪ سوختگی‌ها از پلیت است نه از دست جراح.",vent:"ترفند ونتیلاتور: گراف را بخوان؛ ونتیلاتور با گرافش حرف می‌زند.",defib:"ترفند دفیبریلاتور: هر شیفت ۳۰ ثانیه تست بگیر؛ دستگاهی که تست نشده یعنی خراب."};
// شبیه‌سازی کور
const SIMS=[
{q:"ساعت ۳ شب، ICU. بیمار بدحال، صدای آلارم ممتد، پرستار می‌گوید «عددها به‌هم ریخته، بیمار هم بی‌قراره». روی مانیتور موج‌ها نویزی و SpO2 پایین و پمپ هم آلارم می‌دهد. اول چه می‌کنی؟",opts:["اول بیمار: راه هوایی، نبض، تنفس؛ بعد تفکیک مشکل هر دستگاه جدا","ساکت‌کردن همه آلارم‌ها","جداکردن همه دستگاه‌ها"],exp:"در بحران چنددستگاهی اول ABC بیمار، بعد اولویت‌بندی و تفکیک. سکوت دسته‌جمعی ممنوع."},
{q:"اتاق عمل: وسط جراحی برق ESU که زده می‌شود مانیتور قلب به‌هم می‌ریزد و جراح داد می‌زند «مانیتور خرابه!». واکنش؟",opts:["حفظ خونسردی، تأیید پالس بیمار، مدیریت کابل و فیلتر ESU","خاموش‌کردن مانیتور","دادزدن متقابل"],exp:"تداخل ESU شناخته‌شده است؛ پایش قطع نمی‌شود. مدیریت EMC + ارتباط آرام."},
{q:"بخش نوزادان: پمپ با سرعت بالا آلارم هوا می‌دهد و پرستار می‌خواهد سنسور را غیرفعال کنی تا «راحت شویم».؟",opts:["رد قاطع + رفع علت (ست نوزادی، پرایم، تمیزی سنسور)","غیرفعال موقت","نادیده‌گرفتن"],exp:"اینترلاک ایمنی هرگز bypass نمی‌شود، حتی به اصرار تیم."},
{q:"اورژانس: دفیبریلاتور تست Fail داده ولی کد بعدی هر لحظه ممکن است. سوپروایزر می‌گوید «فعلاً همین باشد».؟",opts:["قفل قرمز + یدک فوری + ثبت و اصرار حرفه‌ای","قبول و سکوت","پاک‌کردن خطا"],exp:"دستگاه Fail در کد یعنی مرگ. ایستادگی حرفه‌ای و مستندسازی وظیفه است."},
{q:"بخش: بیمار می‌گوید «این چسب‌ها پوستم را می‌سوزاند» و می‌خواهد ECG را بکند.؟",opts:["بررسی پوست، جابه‌جایی استاندارد، آموزش و همدلی","کندن و قطع پایش","بی‌توجهی"],exp:"هم حساسیت واقعی است هم نیاز به پایش؛ جابه‌جایی + بررسی آلرژی."}];
let S={tab:"home",dev:null,lv:"easy",step:0,path:[],score:0,safety:0,done:JSON.parse(localStorage.getItem("medi2")||"{}"),simIdx:0,simAns:[]};
function save(){localStorage.setItem("medi2",JSON.stringify(S.done));}
function tab(t){S.tab=t;R();}
function setLv(v){S.lv=v;R();}
function shuffledOpts(st){if(!st._sh)st._sh=sh(st.opts);return st._sh;}
function start(d){S.dev=d;S.step=0;S.path=[];S.score=0;S.safety=0;
DB[d][S.lv].forEach(s=>{s._sh=sh(s.opts);});S.tab="case";R();scrollTo(0,0);}
function R(){
const a=document.getElementById("app");
document.querySelectorAll("nav button").forEach(b=>b.classList.remove("on"));
if(S.tab==="home"){document.getElementById("b1").classList.add("on");
a.innerHTML=`<div class="card"><h2>🎯 انتخاب مأموریت</h2><p style="opacity:.75;line-height:2">آسان ۶ سوال • متوسط ۸ سوال • سخت ۱۰ سوال — سوال‌های هر سطح کاملاً متفاوت‌اند و جای گزینه‌ها هر بار قاطی می‌شود.</p>
<div class="no-print" style="margin:10px 0"><label>سطح: </label><select onchange="setLv(this.value)"><option value="easy">🟢 آسان (۶)</option><option value="medium">🟡 متوسط (۸)</option><option value="advanced">🔴 سخت (۱۰)</option></select></div>
<div class="grid">${Object.keys(DB).map(k=>`<div class="device" onclick="start('${k}')"><img src="${DB[k].img}" loading="lazy"><h3>${DB[k].icon} ${DB[k].title}</h3><small style="opacity:.7">${DB[k].gdesc.slice(0,60)}...</small><br><span class="badge">${S.done[k+"_"+S.lv]?"✅ انجام‌شده":"⬜"}</span><span class="badge warn">${S.lv==="easy"?"۶ سوال":S.lv==="medium"?"۸ سوال":"۱۰ سوال"}</span></div>`).join("")}</div>
<div class="stats"><div class="stat"><b>${Object.keys(S.done).length}</b>مأموریت تکمیل‌شده</div><div class="stat"><b>${S.score}</b>امتیاز</div></div>
<button class="btn danger" onclick="localStorage.removeItem('medi2');S.done={};R()">↺ ریست پیشرفت</button></div>`;
a.querySelector("select").value=S.lv;
}
else if(S.tab==="gallery"){document.getElementById("b2").classList.add("on");
a.innerHTML=`<div class="card"><h2>🔬 گالری دستگاه‌های مهندسی پزشکی</h2><p style="opacity:.75;line-height:2">آشنایی تصویری + نکته فنی هر دستگاه</p><div class="gal">${Object.keys(DB).map(k=>`<div class="device"><img src="${DB[k].img}"><h3>${DB[k].icon} ${DB[k].title}</h3><p>${DB[k].gdesc}</p><button class="btn ghost" onclick="start('${k}')">شروع مأموریت این دستگاه</button></div>`).join("")}</div></div>`;
}
else if(S.tab==="sim"){document.getElementById("b3").classList.add("on");
const s=SIMS[S.simIdx];
if(S.tab==="sim"&&!s){a.innerHTML=`<div class="card"><h2>🏥 نتیجه شبیه‌سازی کور</h2>${S.simAns.map((x,i)=>`<p style="line-height:2">سناریو ${i+1}: ${x.ok?"✅ درست":"❌ نیاز به مرور"} — ${SIMS[i].exp}</p>`).join("")}<button class="btn" onclick="S.simIdx=0;S.simAns=[];R()">↺ شروع دوباره</button></div>`;}
else a.innerHTML=`<div class="card"><span class="badge red">شبیه‌سازی کور ${S.simIdx+1} از ${SIMS.length}</span><span class="badge">موضوع گفته نمی‌شود — خودت حدس بزن!</span><h2 style="margin:12px 0;line-height:2">${s.q}</h2><textarea id="ta" placeholder="اول اینجا بنویس: به‌نظرت مشکل از کدام دستگاه/سیستم است و اولین کارت چیست؟ (این متن در تحلیل لحاظ می‌شود)"></textarea>${s.opts.map((o,i)=>`<button class="option" onclick="simAns(${i})">${o}</button>`).join("")}</div>`;
}
else if(S.tab==="case"){
const arr=DB[S.dev][S.lv];const st=arr[S.step];const pct=Math.round(S.step/arr.length*100);
a.innerHTML=`<div class="card"><div><span class="badge">${DB[S.dev].title}</span><span class="badge">مرحله ${S.step+1} از ${arr.length}</span><span class="badge">امتیاز ${S.score}</span><span class="badge ${S.safety<0?"warn":""}">ایمنی ${S.safety}</span></div><div class="progress"><div style="width:${pct}%"></div></div>
<h2 style="margin:12px 0;line-height:2">${st.q}</h2>
${st._sh.map(o=>`<button class="option" onclick="ans('${o.t.replace(/'/g,"")}')">${o.t}</button>`).join("")}
<button class="btn danger" onclick="tab('home')">انصراف</button></div>`;
}
else if(S.tab==="fb"){
const l=S.path[S.path.length-1];
a.innerHTML=`<div class="card"><h2>${l.gain>=20?"✅":"⚠️"} ثبت شد</h2><div class="feedback">واکنشت ثبت شد. تحلیل کامل آخر تست داده می‌شود.</div><button class="btn" onclick="nxt()">مرحله بعد ←</button></div>`;
}
else if(S.tab==="report"){
const arr=S.path;const pct=Math.round(S.score/(arr.length*20)*100);
let grade=pct>=85?"⭐ عملکرد حرفه‌ای":pct>=60?"قابل قبول + نیاز به مرور":"نیاز به آموزش مجدد";
let rows=arr.map((p,i)=>`<tr><td>${i+1}</td><td>${p.q}</td><td>${p.choice}</td><td>${p.gain} / ${p.safe}</td><td>${p.feedback}<br>${p.cause}</td></tr>`).join("");
let errs=arr.filter(p=>p.gain<15);
a.innerHTML=`<div class="card"><h2>📋 گزارش اختصاصی — ${DB[S.dev].title} (${S.lv==="easy"?"آسان":S.lv==="medium"?"متوسط":"سخت"})</h2>
<p style="opacity:.7">تاریخ: ${new Date().toLocaleDateString("fa-IR")}</p>
<div class="stats"><div class="stat"><b>${S.score}</b>امتیاز فنی</div><div class="stat"><b>${S.safety}</b>ایمنی</div><div class="stat"><b>٪${pct}</b>${grade}</div></div>
<h3>۱) روند تصمیم‌گیری تو</h3><table><tr><th>#</th><th>سوال</th><th>انتخاب</th><th>نمره</th><th>تحلیل</th></tr>${rows}</table>
<h3 style="margin-top:12px">۲) تحلیل خطاها و نکات مهم</h3><p style="line-height:2.2">${errs.length?errs.map(e=>"• "+e.feedback+" — "+e.cause).join("<br>"):"خطای مهمی نداشتی. روندت اصولی (بیمار اول، ساده به پیچیده، بدون bypass ایمنی) بود."}</p>
<p style="line-height:2.2">روند کلی: ${pct>=85?"تصمیم‌هایت پایدار و ایمن بود. همین فرمان را نگه دار.":pct>=60?"بعضی جاها عجله یا پرش به گزینه پیچیده داشتی؛ همیشه اول بیمار، بعد ساده‌ترین علت.":"الگویت نیاز به اصلاح دارد: اول ABC بیمار، بعد علت ساده، هرگز اینترلاک را دور نزن."}</p>
<h3>۳) 🎁 ترفند استادکار</h3><p style="line-height:2.2;background:#0f2f28;border:1px solid #00e5cc;border-radius:10px;padding:12px">${TRICK[S.dev]}</p>
<div class="no-print" style="margin-top:10px"><button class="btn" onclick="window.print()">🖨️ چاپ / PDF</button><button class="btn ghost" onclick="dl()">⬇️ دانلود</button><button class="btn ghost" onclick="tab('home')">مأموریت بعدی</button><button class="btn danger" onclick="start(S.dev)">↺ شروع دوباره (جای گزینه‌ها عوض می‌شود)</button></div></div>`;
}
}
function ans(t){const arr=DB[S.dev][S.lv];const st=arr[S.step];const o=st._sh.find(x=>x.t===t)||st._sh0;S.score+=o.s;S.safety+=o.safe;S.path.push({q:st.q,choice:o.t,gain:o.s,safe:o.safe,feedback:o.f,cause:o.c});S.tab="fb";R();scrollTo(0,0);}
function nxt(){const arr=DB[S.dev][S.lv];S.step++;if(S.step>=arr.length){S.tab="report";S.done[S.dev+"_"+S.lv]=1;save();}else S.tab="case";R();scrollTo(0,0);}
function dl(){let t=`MEDI REPORT ${DB[S.dev].title} ${S.lv} Score:${S.score} Safety:${S.safety}\n`;S.path.forEach((p,i)=>{t+=`${i+1}. ${p.q}\n>${p.choice} (${p.gain})\n${p.feedback}\n`;});t+=TRICK[S.dev];let b=new Blob([t],{type:"text/plain;charset=utf-8"});let a2=document.createElement("a");a2.href=URL.createObjectURL(b);a2.download="medi-report.txt";a2.click();}
function simAns(i){const s=SIMS[S.simIdx];const ok=(i===0);S.simAns.push({ok:ok});alert((ok?"✅ واکنش درست. ":"⚠️ نیاز به مرور. ")+s.exp);S.simIdx++;if(S.simIdx>=SIMS.length){S.tab="sim";document.getElementById("app").innerHTML=`<div class="card"><h2>🏥 پایان شبیه‌سازی کور</h2><p style="line-height:2.2">از ${SIMS.length} سناریو، ${S.simAns.filter(x=>x.ok).length} واکنش درست داشتی.</p>${SIMS.map((x,i)=>`<p style="line-height:2">• سناریو ${i+1}: ${S.simAns[i].ok?"✅":"❌"} — ${x.exp}</p>`).join("")}<p style="line-height:2;background:#0f2f28;border:1px solid #00e5cc;border-radius:10px;padding:10px;margin-top:8px">🎁 ترفند شبیه‌سازی: در بحران واقعی اول با صدای بلند نقش‌ها را تقسیم کن (تو بیمار، تو دستگاه، تو یدک بیار)؛ شلوغی بدون نقش = خطا.</p><button class="btn" onclick="S.simIdx=0;S.simAns=[];R()">↺ شروع دوباره</button><button class="btn ghost" onclick="tab('home')">مأموریت‌ها</button></div>`;}else R();}
R();
</script>
</body>
</html>
